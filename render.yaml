services:
  - type: web
    name: sapc-ai-reviewer-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_MATH
        sync: false
      - key: GROQ_API_KEY_FILIPINO
        sync: false
      - key: GROQ_API_KEY_PE
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
